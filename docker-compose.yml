name: hrm

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

networks:
  frontend:
  backend:
    internal: true      # khong ra Internet, khong publish duoc port
  monitoring:
    internal: true

volumes:
  db-data:
  pgadmin-data:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:

services:
  db:
    image: postgres:16-alpine
    <<: *hardening
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      EXPORTER_DB_USER: ${EXPORTER_DB_USER}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    image: hrm-app:1.0
    <<: *hardening
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [frontend, backend]

  pgadmin:
    image: dpage/pgadmin4:8.14
    <<: *hardening
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks: [frontend, backend]

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    <<: *hardening
    depends_on: [app, pgadmin]
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/locations:/etc/nginx/locations:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [frontend]

  prometheus:
    image: prom/prometheus:v2.55.1
    <<: *hardening
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.external-url=https://${SERVER_IP}/prometheus/
      - --web.route-prefix=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    networks: [monitoring, frontend]

  grafana:
    image: grafana/grafana:11.3.0
    <<: *hardening
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SERVER_ROOT_URL: https://${SERVER_IP}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [monitoring, frontend]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    <<: *hardening
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${EXPORTER_DB_USER}
      DATA_SOURCE_PASS: ${EXPORTER_DB_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    networks: [backend, monitoring]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    <<: *hardening
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on: [nginx]
    read_only: true
    cap_drop: [ALL]
    networks: [frontend, monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    <<: *hardening
    privileged: true     # bat buoc de doc cgroup cua cac container (ngoai le co chu dich)
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]
