server_tokens off;                 # an phien ban nginx
client_max_body_size 2m;
limit_req_zone $binary_remote_addr zone=req_limit:10m rate=20r/s;
limit_req_status 429;

log_format json_log escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"request_time":$request_time,"user_agent":"$http_user_agent"}';

upstream hrm_app { server app:3000; }

# HTTP -> HTTPS
server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log json_log;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log json_log;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    include /etc/nginx/snippets/security-headers.conf;

    # Khong cho nguoi ngoai xem metrics noi bo
    location = /metrics { deny all; }

    location / {
        limit_req zone=req_limit burst=40 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'" always;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://hrm_app;
    }

    location /pgadmin/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_pass http://pgadmin:5050/;
        proxy_redirect off;
    }

    # Cac location giam sat se them o commit 2
    include /etc/nginx/locations/*.conf;
}

# stub_status cho nginx-exporter - chi mang docker noi bo truy cap, khong publish ra host
server {
    listen 8081;
    access_log off;
    location = /stub_status {
        stub_status;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }
}
